name: Integration Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PGPM_VERSION: '4.7.4'

jobs:
  pgpm-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: password

    services:
      pg_db:
        image: docker.io/constructiveio/postgres-plus:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout agentic-db
        uses: actions/checkout@v4

      - name: Cache pgpm CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: pgpm-${{ runner.os }}-${{ env.PGPM_VERSION }}

      - name: Install pgpm CLI globally
        run: npm install -g pgpm@${{ env.PGPM_VERSION }}

      - name: Create test database and bootstrap users
        run: |
          eval "$(pgpm env)"
          createdb agentic_db_test
          pgpm admin-users bootstrap --database agentic_db_test --yes
          pgpm admin-users add --database agentic_db_test --test --yes

      - name: Install extensions
        run: |
          eval "$(pgpm env)"
          psql -d agentic_db_test -c "CREATE EXTENSION IF NOT EXISTS pg_textsearch;"

      - name: Deploy agentic-db package
        run: |
          eval "$(pgpm env)"
          cd packages/agentic-db
          pgpm deploy --package agentic-db --database agentic_db_test --yes

      - name: Deploy agentic-db-services package
        run: |
          eval "$(pgpm env)"
          cd packages/agentic-db-services
          pgpm deploy --package agentic-db-services --database agentic_db_test --yes

      - name: Verify deployment
        run: |
          eval "$(pgpm env)"

          echo "=== Schemas ==="
          psql -d agentic_db_test -tAc "
            SELECT schema_name FROM information_schema.schemata
            WHERE schema_name LIKE 'agentic_db_%'
            ORDER BY schema_name;
          "

          echo "=== Table count ==="
          TABLE_COUNT=$(psql -d agentic_db_test -tAc "
            SELECT count(*) FROM information_schema.tables
            WHERE table_schema LIKE 'agentic_db_%';
          ")
          echo "Tables: ${TABLE_COUNT}"
          if [ "${TABLE_COUNT}" -lt 1 ]; then
            echo "ERROR: No tables found!"
            exit 1
          fi

          echo "=== BM25 indexes ==="
          BM25_COUNT=$(psql -d agentic_db_test -tAc "
            SELECT count(*) FROM pg_indexes
            WHERE indexdef LIKE '%USING bm25%';
          ")
          echo "BM25 indexes: ${BM25_COUNT}"

          echo "Deployment verified!"

  orm-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: password

    services:
      pg_db:
        image: docker.io/constructiveio/postgres-plus:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run ORM tests
        run: |
          cd packages/integration-tests
          pnpm test:orm

  embedding-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: password

    services:
      pg_db:
        image: docker.io/constructiveio/postgres-plus:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run embedding tests
        run: |
          cd packages/integration-tests
          pnpm test:embeddings
