# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  high_level_summary: true
  review_status: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!pnpm-lock.yaml"
    - "!**/dist/**"
    - "!**/__snapshots__/**"
    - "!extensions/**"
    - "!sdk/cli/generated/**"
    - "!sdk/sdk/src/generated/**"
    - "!**/__generated__/**"
  path_instructions:
    - path: "packages/**/*.ts"
      instructions: >-
        Follow the README's schema workflow: edit provisioning blueprints, provision, export SQL modules, then regenerate SDK and CLI. Preserve the documented unified-search and spatial-query behavior and cover changes through the existing integration or CLI end-to-end tests.
chat:
  art: false
