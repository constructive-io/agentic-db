apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: agentic-db
data:
  POSTGRES_USER: postgres
  POSTGRES_DB: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: server-config
  namespace: agentic-db
data:
  NODE_ENV: production
  PORT: "3000"
  SERVER_HOST: "0.0.0.0"
  SERVER_TRUST_PROXY: "true"
  SERVER_ORIGIN: "*"
  SERVER_STRICT_AUTH: "false"
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: postgres
  PGDATABASE: constructive
  # Overridden per-deployment: public=false, admin=true
  API_ENABLE_SERVICES: "false"
  API_EXPOSED_SCHEMAS: "metaschema_public,services_public,constructive_auth_public"
  API_META_SCHEMAS: "metaschema_public,services_public,metaschema_modules_public,constructive_auth_public"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-config
  namespace: agentic-db
data:
  OLLAMA_HOST: "0.0.0.0:11434"
