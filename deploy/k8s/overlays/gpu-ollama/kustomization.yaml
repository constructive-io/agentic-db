apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# GPU Ollama overlay: deploy Ollama inside the cluster with NVIDIA GPU
# acceleration. Requires the NVIDIA device plugin to be installed on
# your cluster (https://github.com/NVIDIA/k8s-device-plugin).

resources:
  - ../../base
  - ../../base/ollama.yaml

patches:
  - path: ollama-gpu-patch.yaml
