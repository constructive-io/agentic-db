apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: agentic-db
spec:
  template:
    spec:
      # Schedule on GPU-capable nodes
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ollama
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
              nvidia.com/gpu: "1"
            limits:
              memory: "8Gi"
              cpu: "4"
              nvidia.com/gpu: "1"
