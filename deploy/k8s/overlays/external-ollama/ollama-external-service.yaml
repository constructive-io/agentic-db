# Service that routes to an Ollama running outside the cluster.
#
# Option A (default): Use host.docker.internal for Docker Desktop / minikube.
# Option B: Replace with a static IP using the Endpoints resource below.
#
# For minikube, enable: minikube tunnel
# For kind, the host is accessible at the default gateway.
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: agentic-db
spec:
  type: ExternalName
  externalName: host.docker.internal
  ports:
    - port: 11434
      targetPort: 11434
---
# Alternative: if host.docker.internal doesn't work in your environment,
# comment out the ExternalName Service above and uncomment this block.
# Replace 192.168.x.x with your host machine's IP.
