apiVersion: apps/v1
kind: Deployment
metadata:
  name: constructive-server-admin
  namespace: agentic-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: constructive-server-admin
  template:
    metadata:
      labels:
        app: constructive-server-admin
    spec:
      containers:
        - name: server
          image: ghcr.io/constructive-io/constructive:latest
          command: ["constructive", "server", "--host", "0.0.0.0", "--port", "3000", "--origin", "*"]
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: server-config
            - secretRef:
                name: postgres-secret
          env:
            - name: API_IS_PUBLIC
              value: "false"
            - name: API_ANON_ROLE
              value: "administrator"
            - name: API_ROLE_NAME
              value: "administrator"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: constructive-server-admin
  namespace: agentic-db
spec:
  selector:
    app: constructive-server-admin
  ports:
    - port: 3000
      targetPort: 3000
